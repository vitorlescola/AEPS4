
<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Configurações - AEPS4</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">

    <div class="container">

        <a class="navbar-brand fw-bold"
           th:href="@{/menu}">
            AEPS4
        </a>

        <a class="btn btn-outline-light"
           th:href="@{/menu}">
            Voltar
        </a>

    </div>

</nav>

<div class="container mt-5 mb-5">

    <div class="row justify-content-center">

        <div class="col-md-8 col-lg-7">

            <div class="card shadow">

                <div class="card-header bg-white p-4">

                    <h3 class="mb-1">
                        Configurações da conta
                    </h3>

                    <p class="text-muted mb-0">
                        Gerencie suas informações pessoais.
                    </p>

                </div>

                <div class="card-body p-4">

                    <h5 class="mb-4">
                        Informações pessoais
                    </h5>

                    <div class="mb-3">

                        <label class="form-label text-muted">
                            Nome completo
                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${conta.nomePessoa}"
                               readonly>

                    </div>

                    <div class="mb-3">

                        <label class="form-label text-muted">
                            CPF
                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${conta.cpf}"
                               readonly>

                    </div>

                    <div class="mb-3">

                        <label class="form-label text-muted">
                            E-mail
                        </label>

                        <input type="email"
                               class="form-control"
                               th:value="${conta.email}"
                               readonly>

                    </div>

                    <div class="mb-4">

                        <label class="form-label text-muted">
                            Tipo de conta
                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${conta.tipoConta == 'USUARIO' ? 'Usuário' : 'Fornecedor'}"
                               readonly>

                    </div>

                    <hr>

                    <div class="d-grid gap-3">

                        <a th:href="@{/configuracao/editar}"
                           class="btn btn-primary">
                            Editar conta
                        </a>

                        <form th:action="@{/configuracao/excluir}"
                              method="post"
                              onsubmit="return confirm('Tem certeza que deseja excluir sua conta? Esta ação não poderá ser desfeita.');">

                            <button type="submit"
                                    class="btn btn-danger w-100">
                                Excluir conta
                            </button>

                        </form>

                        <form th:action="@{/logout}"
                              method="post">

                            <button type="submit"
                                    class="btn btn-outline-secondary w-100">
                                Sair da conta
                            </button>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
