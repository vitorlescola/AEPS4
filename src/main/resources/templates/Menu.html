
<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Início - AEPS4</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
  <div class="container">

    <a class="navbar-brand fw-bold" href="https://github.com/vitorlescola/AEPS4">
      AEPS4
    </a>

    <form th:action="@{/logout}" method="post">
      <button class="btn btn-outline-light"
              type="submit">
        Sair
      </button>
    </form>

  </div>
</nav>

<div class="container mt-5">

  <div class="card shadow p-4">

    <h2>Bem-vindo ao sistema!</h2>

    <p class="text-muted">
      Você realizou o login com sucesso.
    </p>

    <div sec:authorize="hasRole('USUARIO')">

      <h4 class="text-primary">
        Área do Usuário
      </h4>

      <p>
        Você está autenticado como usuário.
      </p>

    </div>

    <div sec:authorize="hasRole('FORNECEDOR')">

      <h4 class="text-success">
        Área do Fornecedor
      </h4>

      <p>
        Você está autenticado como fornecedor.
      </p>

    </div>

  </div>

</div>

</body>
</html>
