
<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Editar conta - AEPS4</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container d-flex justify-content-center
            align-items-center min-vh-100 py-5">

    <div class="card shadow p-4"
         style="width: 100%; max-width: 500px;">

        <div class="text-center mb-4">

            <h2 class="fw-bold">
                Editar conta
            </h2>

            <p class="text-muted">
                Atualize suas informações pessoais.
            </p>

        </div>

        <div th:if="${erro}"
             class="alert alert-danger"
             th:text="${erro}">
        </div>

        <form th:action="@{/configuracao/editar}"
              method="post">

            <div class="mb-3">

                <label class="form-label">
                    Nome completo
                </label>

                <input type="text"
                       name="nomePessoa"
                       class="form-control"
                       th:value="${conta.nomePessoa}"
                       required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    CPF
                </label>

                <input type="text"
                       name="cpf"
                       class="form-control"
                       th:value="${conta.cpf}"
                       maxlength="14"
                       required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    E-mail
                </label>

                <input type="email"
                       name="email"
                       class="form-control"
                       th:value="${conta.email}"
                       required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Nova senha
                </label>

                <input type="password"
                       name="senha"
                       class="form-control"
                       placeholder="Deixe vazio para manter a senha atual"
                       minlength="8">

                <small class="text-muted">
                    Preencha somente se desejar alterar sua senha.
                </small>

            </div>

            <div class="mb-4">

                <label class="form-label">
                    Tipo de conta
                </label>

                <input type="text"
                       class="form-control"
                       th:value="${conta.tipoConta == 'USUARIO' ? 'Usuário' : 'Fornecedor'}"
                       readonly>

            </div>

            <button type="submit"
                    class="btn btn-success w-100 mb-3">

                Salvar alterações

            </button>

            <a th:href="@{/configuracao}"
               class="btn btn-outline-secondary w-100">

                Cancelar

            </a>

        </form>

    </div>

</div>

</body>
</html>
