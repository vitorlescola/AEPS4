
<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Meus produtos - AEPS4</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">

    <div class="container">

        <a class="navbar-brand fw-bold"
           th:href="@{/menu}">
            AEPS4
        </a>

        <a class="btn btn-outline-light"
           th:href="@{/configuracao}">
            Configurações
        </a>

    </div>

</nav>

<div class="container mt-5 mb-5">

    <div class="d-flex justify-content-between
                align-items-center mb-4 flex-wrap gap-3">

        <div>

            <h2 class="fw-bold">
                Meus produtos
            </h2>

            <p class="text-muted mb-0">
                Gerencie os produtos cadastrados.
            </p>

        </div>

        <a th:href="@{/fornecedor/produtos/cadastrar}"
           class="btn btn-success">

            + Cadastrar produto

        </a>

    </div>

    <div th:if="${sucesso}"
         class="alert alert-success"
         th:text="${sucesso}">
    </div>

    <div th:if="${erro}"
         class="alert alert-danger"
         th:text="${erro}">
    </div>

    <div th:if="${#lists.isEmpty(produtos)}"
         class="alert alert-info text-center p-4">

        <h5>Nenhum produto cadastrado.</h5>

        <p class="mb-0">
            Clique em "Cadastrar produto" para adicionar seu primeiro produto.
        </p>

    </div>

    <div class="row g-4">

        <div class="col-md-6 col-lg-4"
             th:each="produto : ${produtos}">

            <div class="card shadow-sm h-100">

                <div class="card-body">

                    <h5 class="card-title fw-bold"
                        th:text="${produto.nomeProduto}">
                        Nome do produto
                    </h5>

                    <hr>

                    <p class="card-text">

                        <strong>Estoque:</strong>

                        <span th:text="${produto.estoque}">
                            0
                        </span>

                        unidades

                    </p>

                    <span th:if="${produto.estoque > 0}"
                          class="badge bg-success">
                        Disponível
                    </span>

                    <span th:if="${produto.estoque == 0}"
                          class="badge bg-danger">
                        Sem estoque
                    </span>

                </div>

                <div class="card-footer bg-white">

                    <div class="d-flex gap-2">

                        <a th:href="@{/fornecedor/produtos/editar/{id}(id=${produto.id})}"
                           class="btn btn-primary btn-sm flex-fill">

                            Editar

                        </a>

                        <form th:action="@{/fornecedor/produtos/excluir/{id}(id=${produto.id})}"
                              method="post"
                              class="flex-fill"
                              onsubmit="return confirm('Deseja realmente excluir este produto?');">

                            <button type="submit"
                                    class="btn btn-danger btn-sm w-100">

                                Excluir

                            </button>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <div class="mt-4">

        <a th:href="@{/menu}"
           class="btn btn-outline-secondary">

            Voltar ao início

        </a>

    </div>

</div>

</body>
</html>
