
<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Cadastrar produto - AEPS4</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">

    <div class="container">

        <a class="navbar-brand fw-bold"
           th:href="@{/menu}">
            AEPS4
        </a>

        <a class="btn btn-outline-light"
           th:href="@{/fornecedor/produtos}">
            Meus produtos
        </a>

    </div>

</nav>

<div class="container d-flex justify-content-center
            align-items-center min-vh-100 py-5">

    <div class="card shadow p-4"
         style="width: 100%; max-width: 500px;">

        <div class="text-center mb-4">

            <h2 class="fw-bold">
                Cadastrar produto
            </h2>

            <p class="text-muted">
                Adicione um novo produto ao seu catálogo.
            </p>

        </div>

        <div th:if="${erro}"
             class="alert alert-danger"
             th:text="${erro}">
        </div>

        <form th:action="@{/fornecedor/produtos/cadastrar}"
              method="post">

            <div class="mb-3">

                <label class="form-label">
                    Nome do produto
                </label>

                <input type="text"
                       name="nomeProduto"
                       class="form-control"
                       placeholder="Digite o nome do produto"
                       maxlength="150"
                       required>

            </div>

            <div class="mb-4">

                <label class="form-label">
                    Quantidade em estoque
                </label>

                <input type="number"
                       name="estoque"
                       class="form-control"
                       min="0"
                       value="0"
                       required>

            </div>

            <button type="submit"
                    class="btn btn-success w-100 mb-3">

                Cadastrar produto

            </button>

            <a th:href="@{/menu}"
               class="btn btn-outline-secondary w-100">

                Voltar

            </a>

        </form>

    </div>

</div>

</body>
</html>
